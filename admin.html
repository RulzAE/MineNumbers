<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MineNumbers · Administrador</title>
<meta name="theme-color" content="#4f9fd8">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" media="print" onload="this.media=\'all\'">
<style>
/* Layout: utility dashboard in the game's block palette; sky header band, summary tiles, then a card per saved game */
:root{
  --sky:#7cc4f2;--sky-deep:#4f9fd8;--grass:#5fae3b;--grass-dark:#3f7f26;--wood:#b5874e;--wood-dark:#8a6334;
  --stone:#9a9a9a;--stone-dark:#6f6f6f;--bad:#e2574c;--bad-dark:#a83a31;--ink:#1f2a1a;--muted:#5d6656;
  --paper:#fffaf0;--line:#e6dcc6;--bg:#eef6fc;--emerald:#2ec26b;
  --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--font);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.top{background:linear-gradient(var(--sky),var(--sky-deep));padding-block:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px}
.top img{height:40px;width:auto}
.top h1{margin:0;font:700 20px var(--font);color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.25);flex:1}
main.wrap{padding-block:18px 40px;display:grid;gap:16px}
.panel{background:var(--paper);box-shadow:0 0 0 3px var(--wood-dark);padding:16px;display:grid;gap:12px}
.panel h2{margin:0;font:700 20px var(--font)}
label{font:600 14px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input{width:100%;font:700 26px var(--font);letter-spacing:.3em;text-align:center;padding:10px;border:0;background:#fff;box-shadow:inset 0 0 0 3px var(--wood-dark);color:var(--ink);border-radius:0}
input:focus{outline:none;box-shadow:inset 0 0 0 3px var(--grass)}
.btn{appearance:none;border:0;cursor:pointer;font:700 17px var(--font);color:#fff;padding:12px 16px;min-height:48px;background:var(--grass);box-shadow:inset 0 -5px 0 var(--grass-dark)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid #f5c542;outline-offset:2px}
.btn.wood{background:var(--wood);box-shadow:inset 0 -5px 0 var(--wood-dark)}
.btn.stone{background:var(--stone);box-shadow:inset 0 -5px 0 var(--stone-dark)}
.btn.danger{background:var(--bad);box-shadow:inset 0 -5px 0 var(--bad-dark)}
.btn.sm{min-height:40px;font-size:15px;padding:8px 12px}
.top .btn{min-height:38px;font-size:14px;padding:6px 12px;background:rgba(0,0,0,.22);box-shadow:none}
.msg{margin:0;min-height:1.4em;font-weight:600;color:var(--bad-dark)}
.msg.ok{color:var(--grass-dark)}
.note{margin:0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:#fff;box-shadow:0 0 0 2px var(--line);padding:10px;text-align:center}
.tile b{display:block;font:700 28px var(--font);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .sp{flex:1}
.chip{appearance:none;border:0;cursor:pointer;font:600 15px var(--font);padding:8px 14px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--paper);box-shadow:0 0 0 2px var(--line);padding:14px;display:grid;gap:10px;min-width:0}
.card.deleted{opacity:.75}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.head h3{margin:0;font:700 20px var(--font);overflow-wrap:anywhere}
.code{font:600 14px var(--font);color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums;user-select:all}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;font:700 13px var(--font);padding:4px 10px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);white-space:nowrap}
.pill i{width:10px;height:10px;display:block}
.pill.activo i{background:var(--emerald)}
.pill.inactivo i{background:var(--stone)}
.pill.eliminado i{background:var(--bad)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
dt{color:var(--muted)}
dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.confirm{display:grid;gap:8px;padding:10px;background:#fdecea;box-shadow:inset 0 0 0 2px var(--bad)}
.confirm p{margin:0;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:24px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><img src="logo.png" alt="MineNumbers"><h1>Administrador</h1><button class="btn" id="logout" hidden>Salir</button></div></header>
<main class="wrap">
  <section class="panel" id="login" hidden>
    <h2 id="loginTitle">Entrar</h2>
    <p class="note" id="loginNote"></p>
    <label for="pin1" id="pin1Label">PIN</label>
    <input id="pin1" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <div id="pin2Wrap" hidden>
      <label for="pin2">Confirma el PIN</label>
      <input id="pin2" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    </div>
    <p class="msg" id="loginMsg"></p>
    <button class="btn" id="loginBtn">Entrar</button>
  </section>

  <section id="dash" hidden>
    <div style="display:grid;gap:16px">
      <div class="tiles" id="tiles"></div>
      <div class="bar">
        <div class="bar" role="group" aria-label="Filtrar" id="filters"></div>
        <span class="sp"></span>
        <button class="btn wood sm" id="refresh">Actualizar</button>
      </div>
      <p class="note">Activo = jugó en los últimos 7 días. Al eliminar una partida, en su celular se borra y vuelve a "Jugador nuevo".</p>
      <div class="list" id="list"></div>
    </div>
  </section>
</main>
<script>
(()=>{
const SB_URL="https://ijprsmmbvqvroxfxnebg.supabase.co",SB_KEY="sb_publishable_DDCGbG_YemzdcwPgwRpUqg_3mFE_By1";
const $=s=>document.querySelector(s);
const DAY=864e5,ACTIVE_MS=7*DAY;
let pin="",data=[],filter="todos",hasPin=true,confirmFor=null;
const PIN_KEY="minenumbers-admin-pin";
const savedPin=()=>{try{return localStorage.getItem(PIN_KEY)||""}catch(e){return ""}};
const rememberPin=v=>{try{v?localStorage.setItem(PIN_KEY,v):localStorage.removeItem(PIN_KEY)}catch(e){}};
async function rpc(fn,args){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});if(!r.ok)throw new Error(await r.text());return r.json()}
const ERR={pin_incorrecto:"PIN incorrecto.",bloqueado:"Demasiados intentos. Espera 15 minutos e intenta otra vez.",sin_pin:"Primero crea tu PIN.",pin_corto:"El PIN debe tener al menos 4 números.",ya_existe:"Ya existe un PIN. Entra con él."};
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const status=p=>p.deleted_at?"eliminado":(Date.now()-Date.parse(p.last_seen)<ACTIVE_MS?"activo":"inactivo");
const LABEL={activo:"Activo",inactivo:"Inactivo",eliminado:"Eliminado"};
const fmtDate=d=>new Date(d).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});
const fmtTime=d=>new Date(d).toLocaleTimeString("es-MX",{hour:"numeric",minute:"2-digit"});
function rel(d){const t=Date.parse(d),diff=Date.now()-t,m=Math.round(diff/6e4);
  if(m<1)return "justo ahora";if(m<60)return `hace ${m} min`;
  const a=new Date(t),n=new Date(),y=new Date(n-DAY);
  if(a.toDateString()===n.toDateString())return `hoy ${fmtTime(t)}`;
  if(a.toDateString()===y.toDateString())return `ayer ${fmtTime(t)}`;
  const days=Math.floor(diff/DAY);return days<7?`hace ${days} ${days===1?"día":"días"}`:fmtDate(t)}
const levels=e=>`Mina y Granja N${e>=1000?3:e>=500?2:1} · Figuras N${e>=200?2:1}`;

async function start(){
  try{const r=await rpc("mn_admin_estado");hasPin=!!r.has_pin}catch(e){$("#login").hidden=false;$("#loginMsg").textContent="No se pudo conectar. Revisa tu internet y recarga.";return}
  const sp=savedPin();
  if(hasPin&&sp){pin=sp;if(await load()){showDash();return}rememberPin("")}
  showLogin();
}
function showLogin(){
  $("#dash").hidden=true;$("#logout").hidden=true;$("#login").hidden=false;
  $("#loginTitle").textContent=hasPin?"Entrar":"Crea tu PIN";
  $("#loginNote").textContent=hasPin?"Escribe tu PIN de administrador.":"Es la primera vez. Elige un PIN de al menos 4 números. Este celular lo recordará; con Salir lo olvida.";
  $("#pin2Wrap").hidden=hasPin;$("#loginBtn").textContent=hasPin?"Entrar":"Crear PIN";
  $("#pin1").value="";$("#pin2").value="";$("#loginMsg").textContent="";$("#pin1").focus();
}
async function doLogin(){
  const p1=$("#pin1").value.trim(),msg=$("#loginMsg");msg.className="msg";
  if(!hasPin){
    if(p1.length<4){msg.textContent=ERR.pin_corto;return}
    if(p1!==$("#pin2").value.trim()){msg.textContent="Los dos PIN no coinciden.";return}
    try{const r=await rpc("mn_admin_crear_pin",{p_pin:p1});if(r.error){msg.textContent=ERR[r.error]||r.error;if(r.error==="ya_existe"){hasPin=true;showLogin()}return}}
    catch(e){msg.textContent="No se pudo crear el PIN. Intenta otra vez.";return}
    hasPin=true;
  }
  msg.className="msg ok";msg.textContent="Entrando…";
  pin=p1;if(await load()){rememberPin(pin);showDash()}
}
async function load(){
  try{const r=await rpc("mn_admin_listar",{p_pin:pin});
    if(r.error){pin="";rememberPin("");showLogin();$("#loginMsg").textContent=ERR[r.error]||r.error;return false}
    data=r.partidas||[];return true}
  catch(e){$("#loginMsg").textContent="No se pudo conectar. Intenta otra vez.";return false}
}
function showDash(){$("#login").hidden=true;$("#dash").hidden=false;$("#logout").hidden=false;render()}
function render(){
  const c={todos:data.length,activo:0,inactivo:0,eliminado:0};data.forEach(p=>c[status(p)]++);
  $("#tiles").innerHTML=[["todos","Partidas"],["activo","Activas"],["inactivo","Inactivas"],["eliminado","Eliminadas"]].map(([k,l])=>`<div class="tile"><b>${c[k]}</b><span>${l}</span></div>`).join("");
  $("#filters").innerHTML=[["todos","Todos"],["activo","Activos"],["inactivo","Inactivos"],["eliminado","Eliminados"]].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
  $("#filters").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;confirmFor=null;render()});
  const rows=data.filter(p=>filter==="todos"||status(p)===filter);
  $("#list").innerHTML=rows.length?rows.map(card).join(""):`<p class="empty">No hay partidas en esta lista.</p>`;
  $("#list").querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.code,b.dataset.act));
}
function card(p){
  const st=status(p),name=p.name?esc(p.name):"Sin nombre",asking=confirmFor&&confirmFor.code===p.code;
  let acts="";
  if(asking){const t=confirmFor.act==="eliminar"?`¿Eliminar la partida de ${name}? En su celular se borrará y volverá a "Jugador nuevo".`:`¿Borrar definitivo la partida de ${name}? Ya no se podrá restaurar.`;
    acts=`<div class="confirm"><p>${t}</p><div class="acts"><button class="btn danger sm" data-code="${p.code}" data-act="si">Sí, ${confirmFor.act==="eliminar"?"eliminar":"borrar"}</button><button class="btn stone sm" data-code="${p.code}" data-act="no">Cancelar</button></div></div>`}
  else if(st==="eliminado")acts=`<div class="acts"><button class="btn wood sm" data-code="${p.code}" data-act="restaurar">Restaurar</button><button class="btn danger sm" data-code="${p.code}" data-act="borrar">Borrar definitivo</button></div>`;
  else acts=`<div class="acts"><button class="btn danger sm" data-code="${p.code}" data-act="eliminar">Eliminar</button></div>`;
  return `<article class="card${st==="eliminado"?" deleted":""}">
    <div class="head"><div><h3>${name}</h3><div class="code">${esc(p.code)}</div></div><span class="pill ${st}"><i></i>${LABEL[st]}</span></div>
    <dl>
      <dt>Esmeraldas</dt><dd>${p.gems} actuales · ${p.earned} ganadas</dd>
      <dt>Niveles</dt><dd>${levels(p.earned)}</dd>
      <dt>Compras</dt><dd>${p.owned} ${p.owned===1?"artículo":"artículos"}</dd>
      <dt>Última vez</dt><dd>${rel(p.last_seen)}</dd>
      <dt>Creada</dt><dd>${fmtDate(p.created_at)}</dd>
      ${p.deleted_at?`<dt>Eliminada</dt><dd>${fmtDate(p.deleted_at)}</dd>`:""}
    </dl>${acts}</article>`;
}
async function act(code,a){
  if(a==="eliminar"||a==="borrar"){confirmFor={code,act:a};return render()}
  if(a==="no"){confirmFor=null;return render()}
  const accion=a==="si"?confirmFor.act:a;confirmFor=null;
  try{const r=await rpc("mn_admin_accion",{p_pin:pin,p_code:code,p_accion:accion});if(r.error){pin="";showLogin();$("#loginMsg").textContent=ERR[r.error]||r.error;return}}
  catch(e){alertBox("No se pudo completar. Intenta otra vez.");return}
  if(await load())render();
}
function alertBox(t){$("#list").insertAdjacentHTML("afterbegin",`<p class="msg">${esc(t)}</p>`)}
$("#loginBtn").onclick=doLogin;
["#pin1","#pin2"].forEach(s=>$(s).addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()}));
$("#refresh").onclick=async()=>{if(await load())render()};
$("#logout").onclick=()=>{pin="";data=[];rememberPin("");showLogin()};
start();
})();
</script>
</body>
</html>

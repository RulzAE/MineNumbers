<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MineNumbers</title>
<meta name="theme-color" content="#7cc4f2">
<meta name="description" content="Juego de números con bloques para preescolar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen phone game; sky band on top, grass/dirt ground at bottom, big blocky tap targets in between */
:root{
  --sky:#7cc4f2; --sky-deep:#4f9fd8;
  --grass:#5fae3b; --grass-dark:#3f7f26;
  --dirt:#8a5a34; --dirt-dark:#6b4224;
  --stone:#9a9a9a; --stone-dark:#6f6f6f;
  --wood:#b5874e; --wood-dark:#8a6334;
  --ink:#1f2a1a; --paper:#fffaf0;
  --emerald:#2ec26b; --emerald-dark:#178a47;
  --gold:#f5c542; --bad:#e2574c;
  --font-display:"Pixelify Sans","Courier New",monospace;
  --font-body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(var(--sky) 0%,var(--sky) 70%,var(--sky-deep) 100%)}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;gap:12px}
.ground{height:56px;flex:none;background:
  linear-gradient(var(--grass) 0 14px,var(--grass-dark) 14px 18px,transparent 18px),
  repeating-linear-gradient(90deg,var(--dirt) 0 22px,var(--dirt-dark) 22px 26px,var(--dirt) 26px 44px);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.cloud{position:absolute;z-index:0;background:#fff;opacity:.3;height:18px;box-shadow:18px 0 #fff,36px 0 #fff,18px -14px #fff;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.cloud{animation:drift 60s linear infinite}}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(110vw)}}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex:none}
.bar .spacer{flex:1}
.gems{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);color:#fff;padding:6px 12px 6px 8px;font:700 22px/1 var(--font-body);font-variant-numeric:tabular-nums}
.gem{width:22px;height:22px;background:var(--emerald);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);box-shadow:inset -5px -5px 0 var(--emerald-dark)}
.gem.big{width:44px;height:44px}

/* buttons: block style */
.btn{appearance:none;border:0;cursor:pointer;font:700 22px/1.1 var(--font-body);color:#fff;padding:16px 18px;min-height:64px;
  background:var(--grass);box-shadow:inset 0 -6px 0 var(--grass-dark),inset 0 4px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--grass-dark)}
.btn:focus-visible,.swatch:focus-visible,.choice:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.btn.wood{background:var(--wood);box-shadow:inset 0 -6px 0 var(--wood-dark),inset 0 4px 0 rgba(255,255,255,.2)}
.btn.stone{background:var(--stone);box-shadow:inset 0 -6px 0 var(--stone-dark),inset 0 4px 0 rgba(255,255,255,.25)}
.btn.icon{min-height:52px;width:52px;padding:0;background:rgba(0,0,0,.25);box-shadow:none}
.btn.icon svg{width:28px;height:28px;fill:#fff}

h1{font:700 clamp(30px,9vw,44px)/1 var(--font-display);color:#fff;text-shadow:3px 3px 0 var(--sky-deep),5px 5px 0 rgba(0,0,0,.2);margin:0;text-align:center;text-wrap:balance}
.panel{background:var(--paper);box-shadow:0 0 0 4px var(--wood-dark);padding:14px}
.prompt{font:700 26px/1.15 var(--font-body);text-align:center;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3);text-wrap:balance;margin:0}

/* avatar */
.avatar{--s:8px;position:relative;width:calc(var(--s)*8);height:calc(var(--s)*16);flex:none}
.avatar div{position:absolute}
.av-head{left:0;top:0;width:calc(var(--s)*8);height:calc(var(--s)*8);background:var(--skin)}
.av-hair{left:0;top:0;width:calc(var(--s)*8);height:calc(var(--s)*2);background:var(--hair);box-shadow:0 var(--s) 0 0 var(--hair)}
.av-hair.side{width:var(--s);height:calc(var(--s)*4);box-shadow:calc(var(--s)*7) 0 0 var(--hair)}
.av-eye{top:calc(var(--s)*4);width:var(--s);height:var(--s);background:#fff;box-shadow:var(--s) 0 0 var(--eye)}
.av-eye.l{left:var(--s)} .av-eye.r{left:calc(var(--s)*5)}
.av-mouth{left:calc(var(--s)*3);top:calc(var(--s)*6);width:calc(var(--s)*2);height:calc(var(--s)*.75);background:#7a3b2e}
.av-body{left:calc(var(--s)*2);top:calc(var(--s)*8);width:calc(var(--s)*4);height:calc(var(--s)*4);background:var(--shirt)}
.av-arm{top:calc(var(--s)*8);width:calc(var(--s)*2);height:calc(var(--s)*4);background:var(--skin);box-shadow:inset 0 calc(var(--s)*1.5) 0 var(--shirt)}
.av-arm.l{left:0}.av-arm.r{left:calc(var(--s)*6)}
.av-leg{top:calc(var(--s)*12);width:calc(var(--s)*2);height:calc(var(--s)*4);background:var(--pants);box-shadow:inset 0 calc(var(--s)*-1) 0 #3b3b3b}
.av-leg.l{left:calc(var(--s)*2)}.av-leg.r{left:calc(var(--s)*4)}
.av-hat{display:none}
.avatar[data-hat="casco"] .av-hat{display:block;left:calc(var(--s)*-.5);top:calc(var(--s)*-1.5);width:calc(var(--s)*9);height:calc(var(--s)*2.5);background:#f2c230;box-shadow:inset 0 calc(var(--s)*-.6) 0 #c99a12}
.avatar[data-hat="casco"] .av-hat::after{content:"";position:absolute;left:calc(var(--s)*3.5);top:calc(var(--s)*.4);width:calc(var(--s)*2);height:calc(var(--s)*1.4);background:#fffbd0;box-shadow:0 0 calc(var(--s)*1.5) #fff4a0}
.avatar[data-hat="casco"],.avatar[data-hat="gorra"]{margin-top:calc(var(--s)*1.5)}
.avatar[data-hat="pato"]{margin-top:calc(var(--s)*4)}
.avatar[data-hat="navidad"]{margin-top:calc(var(--s)*5.5)}
.avatar[data-hat="pato"] .av-hat{display:block;left:var(--s);top:calc(var(--s)*-2);width:calc(var(--s)*5);height:calc(var(--s)*2.5);background:#f5d63d;box-shadow:inset 0 calc(var(--s)*-.6) 0 #d9b520}
.avatar[data-hat="pato"] .av-hat::before{content:"";position:absolute;left:calc(var(--s)*3);top:calc(var(--s)*-2);width:calc(var(--s)*2.5);height:calc(var(--s)*2.5);background:radial-gradient(circle at 62% 40%,#222 0 calc(var(--s)*.35),transparent calc(var(--s)*.35 + .5px)),#f5d63d}
.avatar[data-hat="pato"] .av-hat::after{content:"";position:absolute;left:calc(var(--s)*5.5);top:calc(var(--s)*-1);width:calc(var(--s)*1.5);height:calc(var(--s)*.8);background:#f08a1c}
.avatar[data-hat="navidad"] .av-hat{display:block;left:var(--s);top:calc(var(--s)*-1.5);width:calc(var(--s)*6);height:calc(var(--s)*1.5);background:radial-gradient(circle at 25% 50%,#e2574c 0 calc(var(--s)*.4),transparent calc(var(--s)*.4 + .5px)),radial-gradient(circle at 75% 50%,#f5c542 0 calc(var(--s)*.4),transparent calc(var(--s)*.4 + .5px)),#2e8b3a}
.avatar[data-hat="navidad"] .av-hat::before{content:"";position:absolute;left:var(--s);top:calc(var(--s)*-1.5);width:calc(var(--s)*4);height:calc(var(--s)*1.5);background:radial-gradient(circle at 60% 50%,#2f6fd6 0 calc(var(--s)*.4),transparent calc(var(--s)*.4 + .5px)),#3a9a46}
.avatar[data-hat="navidad"] .av-hat::after{content:"";position:absolute;left:calc(var(--s)*2);top:calc(var(--s)*-2.8);width:calc(var(--s)*2);height:calc(var(--s)*1.3);background:#46aa52;box-shadow:0 calc(var(--s)*-1) 0 calc(var(--s)*-.35) #f5c542}
.avatar[data-hat="gorra"] .av-hat{display:block;left:0;top:calc(var(--s)*-1);width:calc(var(--s)*8);height:calc(var(--s)*2);background:var(--cap);box-shadow:calc(var(--s)*2) var(--s) 0 0 var(--cap)}
@media (prefers-reduced-motion:no-preference){.avatar.happy{animation:hop .5s steps(2) 3}}
@keyframes hop{50%{transform:translateY(-14px)}}

/* creator */
.creator{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.preview{flex:none;display:flex;justify-content:center;align-items:flex-end;padding:4px 0}
.name-in{width:100%;font:700 26px var(--font-body);padding:12px 14px;border:0;box-shadow:inset 0 0 0 4px var(--wood-dark);background:var(--paper);color:var(--ink);text-align:center;border-radius:0}
.name-in:focus{outline:none;box-shadow:inset 0 0 0 4px var(--gold)}
.row-label{font:700 14px var(--font-body);color:var(--wood-dark);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:46px;height:46px;border:0;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);position:relative}
.swatch[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.swatch.txt{width:auto;padding:0 12px;font:700 16px var(--font-body);background:#e9dfc8;color:var(--ink)}

/* home */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;min-height:0;overflow-y:auto;padding-bottom:8px}
.hello{font:700 26px var(--font-body);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3);margin:0;text-align:center}
.menu{display:grid;gap:12px;width:100%;max-width:420px}
.level{display:flex;gap:8px;justify-content:center}
.level .btn{min-height:52px;font-size:18px;flex:1;max-width:200px}
.level .btn[aria-pressed="false"]{opacity:.55}

/* mine */
.mine-grid{flex:1;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:12px;align-content:center;min-height:0;max-width:440px;width:100%;margin:0 auto}
.ore{aspect-ratio:1;max-width:100%;border:0;cursor:pointer;position:relative;font:700 clamp(40px,14vw,64px)/1 var(--font-body);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.45);
  background-color:var(--stone);
  background-image:linear-gradient(45deg,rgba(0,0,0,.12) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.12) 75%),linear-gradient(45deg,rgba(0,0,0,.12) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.12) 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;box-shadow:inset 0 -8px 0 var(--stone-dark),inset 0 6px 0 rgba(255,255,255,.25);font-variant-numeric:tabular-nums}
.ore.broken{visibility:hidden}
.ore.hint{outline:6px solid var(--gold);outline-offset:-6px}
@media (prefers-reduced-motion:no-preference){.ore.hint{animation:pulse .8s ease-in-out infinite}.ore.shake,.choice.shake{animation:shake .35s}}
@keyframes pulse{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.timebar{height:14px;background:rgba(0,0,0,.25);flex:none}
.timebar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left}
.chunk{position:absolute;width:14px;height:14px;background:var(--stone);box-shadow:inset -3px -3px 0 var(--stone-dark);pointer-events:none;z-index:5}
.fly-gem{position:absolute;z-index:6;pointer-events:none}

/* farm */
.farm{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.pens{display:flex;align-items:center;justify-content:center;gap:8px}
.pen{flex:1;max-width:190px;min-height:120px;background:#9bd46d;box-shadow:0 0 0 6px var(--wood),0 0 0 9px var(--wood-dark);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:10px}
.plus{font:700 44px var(--font-body);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.hen{width:40px;height:40px;position:relative;border:0;padding:0;background:none;cursor:pointer}
.hen i{position:absolute;display:block}
.hen .b{left:6px;top:12px;width:28px;height:22px;background:#fff;box-shadow:inset -4px -4px 0 #dcdcdc}
.hen .h{left:20px;top:2px;width:16px;height:16px;background:#fff}
.hen .c{left:24px;top:-3px;width:8px;height:5px;background:#e2574c}
.hen .k{left:36px;top:8px;width:6px;height:5px;background:#f0a020}
.hen .e{left:30px;top:6px;width:3px;height:3px;background:#222}
.hen .l{left:12px;top:34px;width:3px;height:6px;background:#f0a020;box-shadow:10px 0 #f0a020}
.hen .n{left:-4px;top:-8px;min-width:22px;height:22px;background:var(--gold);color:var(--ink);font:700 15px/22px var(--font-body);text-align:center;display:none}
.hen.counted .n{display:block}
@media (prefers-reduced-motion:no-preference){.hen.jump{animation:hop .4s steps(2) 2}}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:440px;width:100%;margin:0 auto}
.choice{aspect-ratio:1;max-width:100%;border:0;cursor:pointer;font:700 clamp(40px,13vw,60px)/1 var(--font-body);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.4);
  background:var(--wood);box-shadow:inset 0 -8px 0 var(--wood-dark),inset 0 6px 0 rgba(255,255,255,.2);
  background-image:repeating-linear-gradient(0deg,transparent 0 14px,rgba(0,0,0,.1) 14px 16px)}
.equation{font:700 34px var(--font-body);color:#fff;text-align:center;text-shadow:2px 2px 0 rgba(0,0,0,.3);min-height:42px;margin:0;font-variant-numeric:tabular-nums}
.tip{font:600 16px var(--font-body);color:#fff;text-align:center;margin:0;opacity:.9}

/* progress dots */
.dots{display:flex;gap:6px;justify-content:center;flex:none}
.dots i{width:16px;height:16px;background:rgba(0,0,0,.2)}
.dots i.done{background:var(--emerald);box-shadow:inset -3px -3px 0 var(--emerald-dark)}

/* reward */
.reward{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.reward .won{display:flex;align-items:center;gap:10px;font:700 54px var(--font-body);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.3)}

/* hero = avatar + pet */
.hero{display:flex;align-items:flex-end;gap:calc(6px*var(--k,1));flex:none}
.pet{position:relative;flex:none;width:calc(44px*var(--k,1));height:calc(40px*var(--k,1))}
.pet .hen,.pet .pig{position:absolute;left:0;bottom:0;width:44px;height:40px;transform:scale(var(--k,1));transform-origin:0 100%;cursor:default}
.pig i{position:absolute;display:block}
.pig .b{left:0;top:14px;width:34px;height:20px;background:#f4a6b8;box-shadow:inset -4px -4px 0 #e07f97}
.pig .h{left:22px;top:4px;width:20px;height:20px;background:#f4a6b8}
.pig .s{left:36px;top:12px;width:8px;height:7px;background:#e07f97}
.pig .e{left:31px;top:8px;width:3px;height:3px;background:#222}
.pig .l{left:4px;top:34px;width:5px;height:6px;background:#e07f97;box-shadow:20px 0 #e07f97}

/* store hats */
.avatar[data-hat="corona"],.avatar[data-hat="vaquero"]{margin-top:calc(var(--s)*2.5)}
.avatar[data-hat="diamante"]{margin-top:calc(var(--s)*1.5)}
.avatar[data-hat="corona"] .av-hat{display:block;left:calc(var(--s)*.5);top:calc(var(--s)*-1.5);width:calc(var(--s)*7);height:calc(var(--s)*1.8);background:radial-gradient(circle at 50% 50%,#e2574c 0 calc(var(--s)*.45),transparent calc(var(--s)*.45 + .5px)),radial-gradient(circle at 18% 50%,#2f6fd6 0 calc(var(--s)*.35),transparent calc(var(--s)*.35 + .5px)),radial-gradient(circle at 82% 50%,#2f6fd6 0 calc(var(--s)*.35),transparent calc(var(--s)*.35 + .5px)),#f5c542;box-shadow:inset 0 calc(var(--s)*-.4) 0 #c99a12}
.avatar[data-hat="corona"] .av-hat::before{content:"";position:absolute;left:0;top:calc(var(--s)*-1.2);width:calc(var(--s)*7);height:calc(var(--s)*1.2);background:#f5c542;clip-path:polygon(0 100%,0 0,14% 100%,36% 100%,50% 0,64% 100%,86% 100%,100% 0,100% 100%)}
.avatar[data-hat="vaquero"] .av-hat{display:block;left:calc(var(--s)*-1.5);top:calc(var(--s)*-.2);width:calc(var(--s)*11);height:var(--s);background:#8a5a2b;box-shadow:inset 0 calc(var(--s)*-.3) 0 #6b4224}
.avatar[data-hat="vaquero"] .av-hat::before{content:"";position:absolute;left:calc(var(--s)*3);top:calc(var(--s)*-2.2);width:calc(var(--s)*5);height:calc(var(--s)*2.2);background:linear-gradient(transparent 60%,#3b2a1a 60% 85%,transparent 85%),#a06a35}
.avatar[data-hat="diamante"] .av-hat{display:block;left:calc(var(--s)*-.5);top:calc(var(--s)*-1.2);width:calc(var(--s)*9);height:calc(var(--s)*3.2);background:#5ce1e6;box-shadow:inset 0 calc(var(--s)*-.7) 0 #2bb5bf,inset calc(var(--s)*.8) calc(var(--s)*.6) 0 #a8f3f5}

/* pickaxe in hand */
.av-tool{display:none}
.avatar:not([data-tool="none"]){margin-right:calc(var(--s)*3)}
.avatar:not([data-tool="none"]) .av-tool{display:block;left:calc(var(--s)*8.2);top:calc(var(--s)*7);width:calc(var(--s)*.9);height:calc(var(--s)*6.5);background:#8a6334;transform:rotate(25deg);transform-origin:50% 75%}
.av-tool::after{content:"";position:absolute;left:calc(var(--s)*-2.6);top:calc(var(--s)*-.6);width:calc(var(--s)*6);height:calc(var(--s)*1.6);background:var(--pick);clip-path:polygon(0 100%,15% 0,85% 0,100% 100%,82% 55%,18% 55%)}
.avatar[data-tool="pico-madera"]{--pick:#c99a5e}
.avatar[data-tool="pico-oro"]{--pick:#f5c542}
.avatar[data-tool="pico-diamante"]{--pick:#5ce1e6}

/* store + sound screens */
.bar-title{font:700 clamp(19px,5.6vw,26px) var(--font-display);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.btn.gemb{background:var(--emerald);box-shadow:inset 0 -6px 0 var(--emerald-dark),inset 0 4px 0 rgba(255,255,255,.25)}
.btn .gem{width:22px;height:22px}
.btn.gemb .gem{background:#fff;box-shadow:inset -5px -5px 0 #bfeccf}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;border:0;cursor:pointer;background:#e9dfc8;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);font:600 16px/1.15 var(--font-body);color:var(--ink);text-align:left;min-width:0}
.item[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.item:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.chip{width:28px;height:28px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.2)}
.item-tag{display:flex;align-items:center;gap:4px;font:700 16px var(--font-body);font-variant-numeric:tabular-nums}
.item-tag .gem{width:16px;height:16px}
.item-tag.own{color:var(--emerald-dark)}
.item-tag.using{color:var(--wood-dark)}
.shop-act{flex:none}
.diag{display:grid;gap:8px}
.diag-row{display:flex;justify-content:space-between;gap:12px;font:500 16px var(--font-body);border-bottom:2px dashed #e0d4b8;padding-bottom:6px}
.diag-row b{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.diag-row b.ok{color:var(--emerald-dark)}
.diag-row b.bad{color:var(--bad)}
.tips{margin:0;padding-left:20px;display:grid;gap:8px;font:500 15px/1.4 var(--font-body)}

.logo{width:min(100%,320px);height:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15));flex:none}
.join{display:grid;gap:10px;width:100%;max-width:420px}
.form-msg{margin:0;font:600 16px/1.35 var(--font-body);color:var(--wood-dark);min-height:1.35em}
.code-box{font:700 28px var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.06em;text-align:center;padding:12px;background:#fff;box-shadow:inset 0 0 0 4px var(--emerald);user-select:text;-webkit-user-select:text}
.note{margin:0;font:500 15px/1.4 var(--font-body)}
.ground{display:flex;justify-content:center;align-items:flex-start;padding-top:24px}

.ic{width:56px;height:56px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;background:rgba(255,255,255,.6);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.ic.ic-hat{align-items:flex-start;padding-top:2px}
.pick-ic{position:relative;width:44px;height:50px}
.pick-ic i{position:absolute;left:19px;top:10px;width:6px;height:38px;background:#8a6334;transform:rotate(30deg)}
.pick-ic i::after{content:"";position:absolute;left:-17px;top:-4px;width:40px;height:11px;background:var(--pick);clip-path:polygon(0 100%,15% 0,85% 0,100% 100%,82% 55%,18% 55%)}
.pick-ic[data-tool="pico-madera"]{--pick:#c99a5e}
.pick-ic[data-tool="pico-oro"]{--pick:#f5c542}
.pick-ic[data-tool="pico-diamante"]{--pick:#5ce1e6}
.item-tag svg,.btn svg.lk{width:16px;height:16px;fill:currentColor;flex:none}
.btn svg.lk{width:20px;height:20px}
.btn small{font-size:14px;font-weight:600;opacity:.9;font-variant-numeric:tabular-nums}
.level .btn.locked{opacity:1;background:var(--stone);box-shadow:inset 0 -6px 0 var(--stone-dark),inset 0 4px 0 rgba(255,255,255,.25);gap:6px}
/* espadas (diseño propio) */
.avatar[data-tool="espada"],.sword-ic[data-tool="espada"]{--b1:#f4f7f9;--b2:#b7c3cc;--g:#f5c542;--gem:#e2574c;--hd:#6b4224}
.avatar[data-tool="espada-morada"],.sword-ic[data-tool="espada-morada"]{--b1:#d6aef8;--b2:#8a4fd1;--g:#c3ccd4;--gem:#2ec26b;--hd:#3b2a5a}
.avatar:is([data-tool="espada"],[data-tool="espada-morada"]) .av-tool{top:calc(var(--s)*9.6);height:calc(var(--s)*2.6);background:var(--hd);box-shadow:inset 0 calc(var(--s)*-.6) 0 var(--g)}
.avatar:is([data-tool="espada"],[data-tool="espada-morada"]) .av-tool::before{content:"";position:absolute;left:calc(var(--s)*-.2);top:calc(var(--s)*-6.8);width:calc(var(--s)*1.3);height:calc(var(--s)*6.4);background:linear-gradient(90deg,var(--b1) 0 50%,var(--b2) 50%);clip-path:polygon(0 14%,50% 0,100% 14%,100% 100%,0 100%)}
.avatar:is([data-tool="espada"],[data-tool="espada-morada"]) .av-tool::after{left:calc(var(--s)*-1.25);top:calc(var(--s)*-.75);width:calc(var(--s)*3.4);height:calc(var(--s)*.9);background:radial-gradient(circle,var(--gem) 0 calc(var(--s)*.32),transparent calc(var(--s)*.32 + .5px)),var(--g);clip-path:none}
.sword-ic{position:relative;width:44px;height:50px}
.sword-ic i{position:absolute;left:20px;top:34px;width:6px;height:14px;background:var(--hd);box-shadow:inset 0 -3px 0 var(--g);transform:rotate(30deg);transform-origin:50% -150%}
.sword-ic i::before{content:"";position:absolute;left:-1px;top:-30px;width:8px;height:28px;background:linear-gradient(90deg,var(--b1) 0 50%,var(--b2) 50%);clip-path:polygon(0 14%,50% 0,100% 14%,100% 100%,0 100%)}
.sword-ic i::after{content:"";position:absolute;left:-7px;top:-4px;width:20px;height:5px;background:radial-gradient(circle,var(--gem) 0 2px,transparent 2.5px),var(--g)}
/* game setup + textures + animals */
.choose-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:center;max-width:440px;width:100%;margin:0 auto;min-height:0}
.choose-grid.three{grid-template-columns:1fr}
.choose{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border:0;cursor:pointer;background:var(--paper);box-shadow:0 0 0 4px var(--wood-dark),inset 0 -6px 0 #e0d4b8;font:700 22px var(--font-body);color:var(--ink);min-width:0}
.choose:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
.choose .sample{width:100%;max-width:120px;font-size:48px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.three .choose{flex-direction:row;justify-content:flex-start;gap:24px;padding:12px 20px}
.animal-big{width:72px;height:66px;position:relative;display:block;flex:none}

.ore.tx-piedra{background-color:#8c8c8c;background-image:radial-gradient(circle at 22% 28%,#b9b9b9 0 17%,transparent 18%),radial-gradient(circle at 68% 22%,#adadad 0 15%,transparent 16%),radial-gradient(circle at 42% 66%,#c2c2c2 0 19%,transparent 20%),radial-gradient(circle at 84% 72%,#a5a5a5 0 14%,transparent 15%),radial-gradient(circle at 12% 82%,#b0b0b0 0 12%,transparent 13%);background-size:auto;background-position:0 0;box-shadow:inset 0 -8px 0 #5e5e5e,inset 0 6px 0 rgba(255,255,255,.2)}
.ore.tx-madera{background-color:#b5874e;background-image:repeating-linear-gradient(0deg,transparent 0 calc(25% - 3px),#8a6334 calc(25% - 3px) 25%),linear-gradient(90deg,transparent 48%,rgba(0,0,0,.12) 48% 52%,transparent 52%);background-size:auto;background-position:0 0;box-shadow:inset 0 -8px 0 #8a6334,inset 0 6px 0 rgba(255,255,255,.2)}
.ore.tx-jardin{background-color:#8a5a34;background-image:linear-gradient(#5fae3b 0 28%,#3f7f26 28% 34%,transparent 34%),radial-gradient(circle at 25% 62%,#6b4224 0 5%,transparent 6%),radial-gradient(circle at 72% 82%,#6b4224 0 5%,transparent 6%),radial-gradient(circle at 55% 52%,#a06a3e 0 4%,transparent 5%);background-size:auto;background-position:0 0;box-shadow:inset 0 -8px 0 #6b4224}

@media (prefers-reduced-motion:no-preference){.animal.jump{animation:hop .4s steps(2) 2}}

.cow .h{left:26px;top:2px;width:16px;height:16px;background:#fff;box-shadow:inset 6px 0 0 #222}
.cow .c{left:27px;top:-3px;width:3px;height:5px;background:#e8d7a8;box-shadow:11px 0 #e8d7a8}
.cow .s{left:34px;top:11px;width:10px;height:7px;background:#f4a6b8}
.cow .e{left:36px;top:6px;width:3px;height:3px;background:#222}
.cow .l{left:4px;top:32px;width:5px;height:8px;background:#222;box-shadow:20px 0 #222}
.btn.danger{background:var(--bad);box-shadow:inset 0 -6px 0 #a83a31,inset 0 4px 0 rgba(255,255,255,.2)}
.confirm{display:grid;gap:10px;padding:12px;background:#fdecea;box-shadow:inset 0 0 0 3px var(--bad)}
/* sin scroll: todo cabe en pantalla (salvo creador y tienda) */

.home{overflow:hidden!important}
.logo{width:min(100%,320px,42vh)}

.menu .btn{min-height:clamp(52px,8vh,64px)}

@supports (height:1dvh){.mine-grid{max-width:min(440px,calc((100dvh - 330px) * var(--ar,1)))}}

.pen{min-height:96px}
.farm{gap:10px}
.row-sample{width:72px!important;flex:none;font-size:36px!important}
.setup{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:440px;width:100%;margin:0 auto}
.sec-label{margin:0;font:700 20px var(--font-body);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.tex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.lvl-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.btn.play{margin-top:4px}
/* configuración */
.cfg{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding:4px 4px 12px}
.cfg-sec{display:grid;gap:10px}
.cfg .row-label{margin:0}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 18px var(--font-body)}
.toggle{min-width:128px;min-height:46px;border:0;cursor:pointer;font:700 17px var(--font-body);color:#fff;background:var(--stone);box-shadow:inset 0 -5px 0 var(--stone-dark)}
.toggle[aria-checked="true"]{background:var(--grass);box-shadow:inset 0 -5px 0 var(--grass-dark)}
.toggle:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.row3{display:flex;gap:8px}
.btn.sm{min-height:48px;font-size:16px;padding:10px 8px;flex:1}
.cfg .code-box{font-size:24px;padding:8px}
@media (max-height:700px){.btn{min-height:52px;padding:12px 14px;font-size:20px}.prompt{font-size:22px}.hello{font-size:22px}.equation{font-size:28px;min-height:34px}}
/* descanso */
.avatar.tired .av-eye{top:calc(var(--s)*4.5);height:calc(var(--s)*.5);background:#3b2a1a;box-shadow:var(--s) 0 0 #3b2a1a}
.avatar.tired .av-mouth{width:var(--s);left:calc(var(--s)*3.5);height:var(--s);background:#7a3b2e}
.zzz{font:700 34px var(--font-body);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.25);margin-bottom:-14px}
.zzz span{font-size:.8em;margin-left:2px}.zzz span+span{font-size:.6em}
@media (prefers-reduced-motion:no-preference){.zzz{animation:float 2s ease-in-out infinite}}
@keyframes float{50%{transform:translateY(-8px)}}
.muted{font-size:13px;font-weight:500;color:var(--wood-dark);display:block}
.an-grid{grid-template-columns:repeat(3,1fr)}
.an-grid .animal-big{width:58px;height:54px}
.an-grid .animal-big .animal{transform:scale(1.25)}
.sleep{background:rgba(20,40,80,.25);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 16px}
.ore.tx-barro{background-color:#b5633b;background-image:radial-gradient(ellipse at 30% 35%,#cd7c51 0 14%,transparent 15%),radial-gradient(ellipse at 72% 60%,#cd7c51 0 12%,transparent 13%),radial-gradient(circle at 20% 78%,#8f4a2a 0 6%,transparent 7%),radial-gradient(circle at 82% 22%,#8f4a2a 0 5%,transparent 6%),linear-gradient(115deg,transparent 46%,rgba(80,35,15,.35) 46% 49%,transparent 49%);background-size:auto;background-position:0 0;box-shadow:inset 0 -8px 0 #84442a,inset 0 6px 0 rgba(255,255,255,.18)}
/* Figuras */
.fig-word{display:flex;flex-direction:column;align-items:center;flex:none;text-align:center}
.fig-word small{font:700 20px var(--font-body);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.fig-word span{font:700 clamp(48px,15vw,72px)/1.1 var(--font-body);color:#fff;letter-spacing:.02em;
  text-shadow:3px 0 #1d4f91,-3px 0 #1d4f91,0 3px #1d4f91,0 -3px #1d4f91,2px 2px #1d4f91,-2px 2px #1d4f91,2px -2px #1d4f91,-2px -2px #1d4f91,0 7px 0 rgba(0,0,0,.18)}
.fig{aspect-ratio:1;max-width:100%;border:0;cursor:pointer;background:var(--paper);box-shadow:0 0 0 4px var(--wood-dark),inset 0 -6px 0 #e0d4b8;display:flex;align-items:center;justify-content:center;padding:0}
.fig:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
.fig.win{box-shadow:0 0 0 6px var(--gold),inset 0 -6px 0 #e0d4b8}
@media (prefers-reduced-motion:no-preference){.fig.shake{animation:shake .35s}.fig.win .shape{animation:pulse .5s ease-in-out 2}}
.shape{display:block;background:linear-gradient(transparent 78%,rgba(0,0,0,.18) 78%),var(--c)}
.shape.circulo{width:66%;height:66%;border-radius:50%}
.shape.cuadrado{width:60%;height:60%}
.shape.triangulo{width:74%;height:64%;clip-path:polygon(50% 0,100% 100%,0 100%)}
.shape.rectangulo{width:82%;height:46%}
.shape.rombo{width:60%;height:80%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.row-fig{width:72px;flex:none;box-shadow:inset 0 0 0 3px #e0d4b8}
.lvl-row.two{grid-template-columns:repeat(2,1fr)}
.fig-demo{display:flex;justify-content:center;gap:12px}
.fig-demo .fig{width:76px;cursor:default}
.three-fig .fig:last-child{grid-column:1 / -1;width:50%;justify-self:center}
/* app shell (PWA) */
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<body>

<div class="app" id="app">
  <div class="cloud" style="top:40px;left:-60px;width:60px"></div>
  <div class="cloud" style="top:110px;left:-60px;width:44px;animation-delay:-30s"></div>
  <div class="screen" id="screen"></div>
  <div class="ground"><span class="ver" id="ver"></span></div>
</div>

<script>
(()=>{
// ---------- version (actualizar en cada publicación) ----------
const APP_VERSION="1.0",APP_BUILD="Noviembre 2026";
document.getElementById("ver").textContent=`MineNumbers - V.${APP_VERSION} - ${APP_BUILD}`;
// ---------- state ----------
const DEFAULT_CHAR={name:"",skin:"#e9b98f",hair:"#4a2c17",eye:"#2f6fd6",shirt:"#2fa4c9",pants:"#3a4a9a",hat:"none",cap:"#d8433a",tool:"none",pet:"none"};
const STORE=[
  {id:"casco",cat:"hat",name:"Casco de minero",price:200},
  {id:"gorra",cat:"hat",name:"Gorra",price:200},
  {id:"pato",cat:"hat",name:"Pato",price:300},
  {id:"navidad",cat:"hat",name:"Árbol de Navidad",price:250},
  {id:"vaquero",cat:"hat",name:"Sombrero vaquero",price:250},
  {id:"corona",cat:"hat",name:"Corona",price:300},
  {id:"pico-madera",cat:"tool",name:"Pico de madera",price:200},
  {id:"pico-oro",cat:"tool",name:"Pico de oro",price:200},
  {id:"espada",cat:"tool",name:"Espada",price:300},
  {id:"espada-morada",cat:"tool",name:"Espada morada",price:350},
  {id:"gallina",cat:"pet",name:"Gallina",price:500},
  {id:"cerdito",cat:"pet",name:"Cerdito",price:500}
];
const L2_GOAL=500,L3_GOAL=1000;
const CATS={hat:"Sombreros",tool:"En la mano",pet:"Mascotas"};
const OPTS={
  skin:["#f6d2b4","#e9b98f","#c99067","#a56b43","#6e4428"],
  hair:["#1c1c1c","#4a2c17","#8a5a2b","#e1b44a","#c4522c"],
  eye:["#2f6fd6","#3a8a3a","#5a3a1c","#1c1c1c","#8a4fd1"],
  shirt:["#2fa4c9","#d8433a","#3fae4a","#f2c230","#8a4fd1"],
  pants:["#3a4a9a","#2b2b2b","#6b4224","#3f7f26","#b03a6e"],
  cap:["#d8433a","#2f6fd6","#3fae4a","#f2c230","#222222"]
};
let save={char:{...DEFAULT_CHAR},gems:0,level:1,owned:[]};
const KEY="minenumbers";
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.char)save=Object.assign(save,s)}catch(e){}
function migrate(){save.char={...DEFAULT_CHAR,...save.char};if(!Array.isArray(save.owned))save.owned=[];
  if(typeof save.earned!=="number")save.earned=save.gems+save.owned.reduce((t,id)=>t+((STORE.find(i=>i.id===id)||{}).price||0),0);
  const h=save.char.hat;if(h!=="none"&&!save.owned.includes(h))save.owned.push(h);
  if(save.earned<L2_GOAL)save.level=1}
migrate();
const l2Open=()=>save.earned>=L2_GOAL;
function hatList(){return [...STORE.filter(i=>i.cat==="hat"&&save.owned.includes(i.id)).map(i=>[i.id,i.name]),["none","Nada"]]}
// ajustes de este celular (no se sincronizan)
const SET_KEY="minenumbers-ajustes";
let settings={sfx:true,voice:true,rest:true,tex:"jardin",lvl:1,animal:"gallina",flvl:1,glvl:1};
try{Object.assign(settings,JSON.parse(localStorage.getItem(SET_KEY)||"{}"))}catch(e){}
function saveSettings(){try{localStorage.setItem(SET_KEY,JSON.stringify(settings))}catch(e){}}
const LEVELS=[{n:1,max:10,goal:0},{n:2,max:20,goal:L2_GOAL},{n:3,max:30,goal:L3_GOAL}];
const lvlOpen=n=>save.earned>=LEVELS[n-1].goal;
const avSize=()=>window.innerHeight<720?6:8;
function writeLocal(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function persist(){save.updatedAt=Date.now();writeLocal();schedulePush()}

// ---------- cloud sync (Supabase) ----------
const SB_URL="https://ijprsmmbvqvroxfxnebg.supabase.co",SB_KEY="sb_publishable_DDCGbG_YemzdcwPgwRpUqg_3mFE_By1";
const CODE_RE=/^MINA-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
let syncState={status:"idle",at:0};
function newCode(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8));let s="";r.forEach(b=>{s+=A[b%A.length]});return "MINA-"+s.slice(0,4)+"-"+s.slice(4)}
function normCode(raw){let c=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.startsWith("MINA"))c=c.slice(4);return c.length===8?"MINA-"+c.slice(0,4)+"-"+c.slice(4):""}
async function rpc(fn,args){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});if(!r.ok)throw new Error(await r.text());return r.json()}
function payload(){const {code,...rest}=save;return rest}
function adopt(remote){if(!remote||!remote.data)return false;const t=Date.parse(remote.updated_at);if(!(t>(save.updatedAt||0)+1))return false;
  const code=save.code;save=Object.assign({char:{...DEFAULT_CHAR},gems:0,level:1,owned:[]},remote.data,{code,updatedAt:t});
  migrate();writeLocal();return true}
function onRemoteChange(){if(typeof sleeping!=="undefined"&&sleeping)return;const gc=document.getElementById("gemCount");if(gc)gc.textContent=save.gems;if(document.getElementById("goLearn"))showHome()}
let pushT=null;
function schedulePush(){if(!save.code)return;clearTimeout(pushT);pushT=setTimeout(pushNow,1200)}
async function pushNow(){if(!save.code)return;if(!navigator.onLine){syncState.status="offline";return}
  try{syncState.status="saving";const r=await rpc("mn_guardar",{p_code:save.code,p_data:payload(),p_updated_at:new Date(save.updatedAt||Date.now()).toISOString()});
    if(adopt(r))onRemoteChange();syncState={status:"ok",at:Date.now()}}catch(e){syncState.status="error"}}
async function pull(){if(!save.code)return;if(!navigator.onLine){syncState.status="offline";return}
  try{const r=await rpc("mn_cargar",{p_code:save.code});
    if(r&&adopt(r))onRemoteChange();else if(!r||Date.parse(r.updated_at)<(save.updatedAt||0)-1)await pushNow();
    syncState={status:"ok",at:Date.now()}}catch(e){syncState.status="error"}}
async function joinCode(raw,msg){const code=normCode(raw);
  if(!code){msg.textContent="El código se ve así: MINA-AB12-CD34";return false}
  if(!navigator.onLine){msg.textContent="Necesitas internet para entrar con un código.";return false}
  msg.textContent="Buscando…";
  try{const r=await rpc("mn_cargar",{p_code:code});if(!r){msg.textContent="No encontré ese código. Revísalo e intenta otra vez.";return false}
    save={char:{...DEFAULT_CHAR},gems:0,level:1,owned:[],code,updatedAt:0};adopt(r);syncState={status:"ok",at:Date.now()};return true}
  catch(e){msg.textContent="No se pudo conectar. Intenta en un momento.";return false}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
window.addEventListener("online",()=>pushNow());

const $=s=>document.querySelector(s);
const screenEl=$("#screen");
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- voice & sound ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/es[-_]MX/i.test(x.lang))||v.find(x=>/es[-_]US/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{
  if(!settings.voice||!("speechSynthesis" in window))return;
  const go=()=>{const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:"es-MX";if(voice)u.voice=voice;u.rate=.95;u.pitch=1.1;speechSynthesis.speak(u)};
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,80)}else go();
}catch(e){}}
let actx=null;
function getCtx(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}if(actx.state==="suspended")actx.resume();return actx}
document.addEventListener("pointerdown",()=>{try{const c=getCtx();if(c){const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}}catch(e){}},{once:true});
function beep(type){try{if(!settings.sfx)return;const ctx=getCtx();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime;
  if(type==="ok"){o.type="square";o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08)}
  else if(type==="break"){o.type="sawtooth";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.15)}
  else{o.type="triangle";o.frequency.setValueAtTime(260,t);o.frequency.setValueAtTime(200,t+.1)}
  g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}}

const PETS={
  gallina:`<div class="hen"><i class="b"></i><i class="h"></i><i class="c"></i><i class="k"></i><i class="e"></i><i class="l"></i></div>`,
  cerdito:`<div class="pig"><i class="b"></i><i class="h"></i><i class="s"></i><i class="e"></i><i class="l"></i></div>`
};
function avatarHTML(c,size=8,extra=""){
  const pet=PETS[c.pet]?`<div class="pet">${PETS[c.pet]}</div>`:"";
  return `<div class="hero" style="--k:${size/8}"><div class="avatar ${extra}" data-hat="${c.hat}" data-tool="${c.tool||"none"}" style="--s:${size}px;--skin:${c.skin};--hair:${c.hair};--eye:${c.eye};--shirt:${c.shirt};--pants:${c.pants};--cap:${c.cap}">
  <div class="av-arm l"></div><div class="av-arm r"></div><div class="av-leg l"></div><div class="av-leg r"></div><div class="av-body"></div>
  <div class="av-head"></div><div class="av-hair"></div><div class="av-hair side" style="left:0;top:${size*2}px"></div>
  <div class="av-eye l"></div><div class="av-eye r"></div><div class="av-mouth"></div><div class="av-hat"></div><div class="av-tool"></div></div>${pet}</div>`}
function itemIcon(i){
  if(i.cat==="hat")return `<span class="ic ic-hat">${avatarHTML({...save.char,hat:i.id,tool:"none",pet:"none"},4)}</span>`;
  if(i.id.startsWith("espada"))return `<span class="ic"><span class="sword-ic" data-tool="${i.id}"><i></i></span></span>`;
  if(i.cat==="tool")return `<span class="ic"><span class="pick-ic" data-tool="${i.id}"><i></i></span></span>`;
  return `<span class="ic"><span class="pet" style="--k:1">${PETS[i.id]||""}</span></span>`}
function gemsHTML(){return `<div class="gems" aria-label="Esmeraldas"><span class="gem"></span><span id="gemCount">${save.gems}</span></div>`}

  screenEl.innerHTML=`

  screenEl.querySelectorAll(".swatches").forEach(g=>g.addEventListener("click",e=>{

    if(k==="hat")$("#capRow").hidden=c.hat!=="gorra";beep("ok");draw()}));
  $("#nameIn").addEventListener("input",e=>{c.name=e.target.value.trim()});
  $("#rand").onclick=()=>{for(const k of ["skin","hair","eye","shirt","pants","cap"])c[k]=OPTS[k][rnd(0,OPTS[k].length-1)];
    screenEl.querySelectorAll(".swatches").forEach(g=>g.querySelectorAll(".swatch").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===c[g.dataset.k])));$("#capRow").hidden=c.hat!=="gorra";beep("ok");draw()};

// ---------- store ----------
function showStore(){
  let sel=null,trial={...save.char};
  screenEl.innerHTML=`
  <div class="bar"><button class="btn icon" id="back" aria-label="Regresar">${ICON.back}</button><span class="bar-title">Tienda</span><div class="spacer"></div>${gemsHTML()}</div>
  <div class="preview" id="pv"></div>
  <p class="tip" id="shopTip">Toca algo para probártelo</p>
  <button class="btn shop-act" id="act" hidden></button>
  <div class="creator">
    <div class="panel" style="display:grid;gap:14px">
      ${Object.entries(CATS).map(([cat,label])=>`<div><p class="row-label">${label}</p><div class="shop-grid">${STORE.filter(i=>i.cat===cat).map(i=>`<button class="item" data-id="${i.id}" aria-pressed="false">${itemIcon(i)}<span>${i.name}</span><span class="item-tag" id="tag-${i.id}"></span></button>`).join("")}</div></div>`).join("")}
    </div>
  </div>`;
  const draw=()=>{$("#pv").innerHTML=avatarHTML(trial,8)};
  const tags=()=>STORE.forEach(i=>{const t=$("#tag-"+i.id),own=save.owned.includes(i.id),using=save.char[i.cat]===i.id;
    t.innerHTML=using?"Usando":own?"Tuyo":`${ICON.lock}<span class="gem"></span>${i.price}`;t.className="item-tag"+(using?" using":own?" own":"")});
  const act=()=>{const b=$("#act");$("#shopTip").hidden=!!sel;b.hidden=!sel;if(!sel)return;
    const own=save.owned.includes(sel.id),using=save.char[sel.cat]===sel.id;b.className="btn shop-act";
    if(using){b.textContent="Quitar";b.classList.add("wood")}
    else if(own){b.textContent="Usar"}
    else if(save.gems>=sel.price){b.innerHTML=`Comprar <span class="gem"></span> ${sel.price}`;b.classList.add("gemb")}
    else{b.textContent=`Te faltan ${sel.price-save.gems}`;b.classList.add("stone")}};
  draw();tags();act();
  screenEl.querySelectorAll(".item").forEach(btn=>btn.onclick=()=>{
    sel=STORE.find(i=>i.id===btn.dataset.id);trial={...save.char,[sel.cat]:sel.id};
    screenEl.querySelectorAll(".item").forEach(x=>x.setAttribute("aria-pressed",x===btn));
    beep("ok");draw();act();
    const own=save.owned.includes(sel.id);
    say(own?`${sel.name}. ¡Ya es tuyo!`:save.gems>=sel.price?`${sel.name}. Cuesta ${sel.price} esmeraldas`:`${sel.name}. Cuesta ${sel.price}. Te faltan ${sel.price-save.gems} esmeraldas`)});
  $("#act").onclick=()=>{if(!sel)return;const own=save.owned.includes(sel.id),using=save.char[sel.cat]===sel.id;
    if(using){save.char[sel.cat]="none";say("Listo, te lo quitaste")}
    else if(own){save.char[sel.cat]=sel.id;say("¡Te queda muy bien!")}
    else if(save.gems>=sel.price){save.gems-=sel.price;save.owned.push(sel.id);save.char[sel.cat]=sel.id;$("#gemCount").textContent=save.gems;beep("ok");say(`¡Compraste ${sel.name}!`)}
    else{beep("no");say(`Te faltan ${sel.price-save.gems} esmeraldas. ¡Juega para ganar más!`);return}
    persist();trial={...save.char};draw();tags();act()};
  $("#back").onclick=showHome;
  say("¡Bienvenido a la tienda! Toca algo para probártelo");
}

function startRound(kind,opt){inGame=true;round={kind,opt,i:0,won:0};QUESTION[kind]()}

  <div class="dots">${Array.from({length:ROUNDS},(_,i)=>`<i class="${i<round.i?"done":""}"></i>`).join("")}</div>`}
function wireBar(text){$("#quit").onclick=()=>{inGame=false;clearTimer();try{speechSynthesis.cancel()}catch(e){}round.kind==="mine"?showMineSetup():round.kind==="farm"?showFarmSetup():showFigSetup()};$("#again").hidden=!settings.voice;$("#again").onclick=()=>say(text)}
function addGems(n,fromEl){save.gems+=n;save.earned=(save.earned||0)+n;round.won+=n;persist();const gc=$("#gemCount");if(gc)gc.textContent=save.gems;
  if(fromEl&&!matchMedia("(prefers-reduced-motion:reduce)").matches){const r=fromEl.getBoundingClientRect(),t=$(".gems").getBoundingClientRect(),app=$("#app").getBoundingClientRect();
    const g=document.createElement("span");g.className="gem fly-gem";g.style.left=(r.left+r.width/2-11-app.left)+"px";g.style.top=(r.top+r.height/2-11-app.top)+"px";$("#app").appendChild(g);
    g.animate([{transform:"translate(0,0) scale(1.6)"},{transform:`translate(${t.left-r.left-r.width/2+20}px,${t.top-r.top-r.height/2+4}px) scale(1)`}],{duration:650,easing:"ease-in"}).onfinish=()=>g.remove()}}
function next(){if(breakDue){inGame=false;return showBreak()}round.i++;if(round.i>=ROUNDS)return showReward();QUESTION[round.kind]()}
let timer=null;function clearTimer(){if(timer){clearTimeout(timer);timer=null}}

// ---------- Mina rápida ----------
function mineQ(){
  const o=round.opt||{},lvl=o.lvl||1,max=LEVELS[lvl-1].max,count=lvl===1?4:6;
  const target=rnd(0,max);const set=new Set([target]);while(set.size<count)set.add(rnd(0,max));
  const nums=shuffle([...set]);const text=`¡Pica el ${target}!`;
  screenEl.innerHTML=`${gameBar()}
    <p class="prompt">${text}</p>
    <div class="timebar"><i id="tb"></i></div>
    <div class="mine-grid" style="--cols:${count===4?2:3};--ar:${count===4?1:1.5}">${nums.map(n=>`<button class="ore tx-${o.tex||"jardin"}" data-n="${n}" aria-label="Bloque ${n}">${n}</button>`).join("")}</div>`;
  wireBar(text);say(text);
  const start=performance.now(),LIMIT=6000;let done=false;
  const tb=$("#tb");tb.animate([{transform:"scaleX(1)"},{transform:"scaleX(0)"}],{duration:LIMIT,fill:"forwards"});
  clearTimer();timer=setTimeout(()=>{if(done)return;const t=screenEl.querySelector(`.ore[data-n="${target}"]`);t&&t.classList.add("hint");say(`Busca el ${target}`)},LIMIT);
  screenEl.querySelectorAll(".ore").forEach(b=>b.onclick=()=>{
    if(done)return;const n=+b.dataset.n;
    if(n===target){done=true;clearTimer();beep("break");burst(b);b.classList.add("broken");
      const fast=performance.now()-start<3000;addGems(fast?2:1,b);beep("ok");say(fast?"¡Súper rápido!":"¡Muy bien!");setTimeout(next,1100)}
    else{beep("no");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");say(`Ese es el ${n}. Busca el ${target}`)}
  });
}
function burst(el){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=el.getBoundingClientRect(),app=$("#app").getBoundingClientRect();
  const col=getComputedStyle(el).backgroundColor;for(let i=0;i<8;i++){const c=document.createElement("span");c.className="chunk";c.style.background=col;c.style.left=(r.left+r.width/2-app.left)+"px";c.style.top=(r.top+r.height/2-app.top)+"px";$("#app").appendChild(c);
    const a=Math.random()*Math.PI*2,d=50+Math.random()*60;c.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px)`,opacity:0}],{duration:600,easing:"ease-out"}).onfinish=()=>c.remove()}}

// ---------- Granja de sumas ----------
const animalHTML=(A,z)=>`<button class="animal ${A.cls}" style="zoom:${z}" aria-label="${A.one}">${A.parts}<i class="n"></i></button>`;
function farmQ(){
  const o=round.opt||{},lvl=o.lvl||1,max=LEVELS[lvl-1].max;const a=rnd(1,max-1),b=rnd(1,max-a),sum=a+b;
  const opts=new Set([sum]);while(opts.size<3){const d=sum+rnd(-3,3);if(d>=2&&d<=max)opts.add(d)}
  const big=Math.max(a,b),z=big<=9?1:big<=16?.7:.5;
  const A=ANIMALS[o.animal]||ANIMALS.gallina,cu=A.fem?"Cuántas":"Cuántos",art=A.fem?"las":"los";
  const cnt=n=>n===1?`1 ${A.one}`:`${n} ${A.many}`;
  const text=`${cnt(a)} y ${cnt(b)}. ¿${cu} son en total?`;
  screenEl.innerHTML=`${gameBar()}
    <div class="farm">
      <p class="prompt">¿${cu} ${A.many} hay?</p>
      <div class="pens"><div class="pen" id="penA">${Array.from({length:a},()=>animalHTML(A,z)).join("")}</div><span class="plus">+</span><div class="pen" id="penB">${Array.from({length:b},()=>animalHTML(A,z)).join("")}</div></div>
      <p class="equation" id="eq">&nbsp;</p>
      <p class="tip">Toca ${art} ${A.many} para contar${art}</p>
      <div class="choices">${shuffle([...opts]).map(n=>`<button class="choice" data-n="${n}">${n}</button>`).join("")}</div>
    </div>`;
  wireBar(text);say(text);
  let counted=0,done=false;
  screenEl.querySelectorAll(".pen .animal").forEach(h=>h.onclick=()=>{if(h.classList.contains("counted"))return;counted++;h.classList.add("counted");h.querySelector(".n").textContent=counted;beep("ok");say(String(counted))});
  screenEl.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{
    if(done)return;const n=+c.dataset.n;
    if(n===sum){done=true;$("#eq").textContent=`${a} + ${b} = ${sum}`;screenEl.querySelectorAll(".pen .animal").forEach(h=>h.classList.add("jump"));
      addGems(1,c);beep("ok");say(`¡Muy bien! ${a} más ${b} son ${sum}`);setTimeout(next,2200)}
    else{beep("no");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");say("Casi. Cuéntalas otra vez")}
  });
}

// ---------- Figuras ----------
const SHAPES=[["circulo","círculo"],["cuadrado","cuadrado"],["triangulo","triángulo"],["rectangulo","rectángulo"],["rombo","rombo"]];
const FIG_LEVELS=[{n:1,goal:0,count:3,voice:true,txt:"3 figuras · con voz"},{n:2,goal:200,count:4,voice:false,txt:"4 figuras · sin voz"}];
const figOpen=n=>save.earned>=FIG_LEVELS[n-1].goal;
function showFigSetup(){
  let lvl=figOpen(settings.glvl||1)?(settings.glvl||1):1;
  screenEl.innerHTML=`<div class="bar"><button class="btn icon" id="back" aria-label="Regresar">${ICON.back}</button><span class="bar-title">Figuras</span><div class="spacer"></div>${gemsHTML()}</div>
  <div class="setup">
    <div class="fig-demo"><span class="fig"><i class="shape circulo" style="--c:#e2574c"></i></span><span class="fig"><i class="shape triangulo" style="--c:#f5c542"></i></span><span class="fig"><i class="shape rombo" style="--c:#2f6fd6"></i></span></div>
    <p class="sec-label">Nivel</p>
    <div class="lvl-row two">${FIG_LEVELS.map(L=>{const open=figOpen(L.n);return `<button class="btn wood lvl${open?"":" locked"}" data-l="${L.n}" aria-pressed="${open&&L.n===lvl}"><span>Nivel ${L.n}</span><small>${open?L.txt:`${ICON.lock} ${Math.min(save.earned,L.goal)}/${L.goal}`}</small></button>`}).join("")}</div>
    <button class="btn play" id="play">¡A jugar!</button>
  </div>`;
  $("#back").onclick=showLearn;
  screenEl.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{const n=+b.dataset.l,L=FIG_LEVELS[n-1];
    if(!figOpen(n)){beep("no");say(`Junta ${L.goal} esmeraldas para abrir el nivel ${n}. Llevas ${save.earned}`);return}
    lvl=n;screenEl.querySelectorAll(".lvl").forEach(x=>x.setAttribute("aria-pressed",x===b));beep("ok");
    say(n===1?"Nivel 1: tres figuras y te leo la palabra":"Nivel 2: cuatro figuras y tú lees la palabra")});
  $("#play").onclick=()=>{settings.glvl=lvl;saveSettings();beep("ok");startRound("fig",{lvl})};
  say("Escoge el nivel");
}
const SHAPE_COLORS=["#5fae3b","#f5c542","#e2574c","#2f6fd6","#8a4fd1","#b5874e"];
function figQ(){
  let t;do{t=SHAPES[rnd(0,SHAPES.length-1)]}while(round.last===t[0]);round.last=t[0];
  const L=FIG_LEVELS[((round.opt||{}).lvl||1)-1];
  const opts=shuffle([t,...shuffle(SHAPES.filter(x=>x!==t)).slice(0,L.count-1)]),cols=shuffle([...SHAPE_COLORS]);
  const text=L.voice?`¡Busca el ${t[1]}!`:"Lee la palabra y busca la figura";
  screenEl.innerHTML=`${gameBar()}
    <div class="fig-word"><small>Busca el</small><span>${t[1]}</span></div>
    <div class="mine-grid fig-grid${L.count===3?" three-fig":""}" style="--cols:2;--ar:1">${opts.map((o,i)=>`<button class="fig" data-v="${o[0]}" aria-label="${o[1]}"><i class="shape ${o[0]}" style="--c:${cols[i]}"></i></button>`).join("")}</div>`;
  wireBar(text);say(text);
  let tries=0,done=false;
  screenEl.querySelectorAll(".fig-grid .fig").forEach(b=>b.onclick=()=>{
    if(done)return;const v=b.dataset.v;
    if(v===t[0]){done=true;b.classList.add("win");addGems(tries===0?2:1,b);beep("ok");say(`¡Muy bien! Es un ${t[1]}`);setTimeout(next,1400)}
    else{tries++;beep("no");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");say(L.voice?`Ese es un ${SHAPES.find(x=>x[0]===v)[1]}. Busca el ${t[1]}`:"Ese no es. Lee la palabra otra vez")}
  });
}

// ---------- reward ----------
function showReward(){inGame=false;
  screenEl.innerHTML=`<div class="bar"><div class="spacer"></div>${gemsHTML()}</div>
  <div class="reward">
    <h1>¡Lo lograste!</h1>
    ${avatarHTML(save.char,avSize()+2,"happy")}
    <div class="won"><span class="gem big"></span>+${round.won}</div>
    <div class="menu"><button class="btn" id="replay">Jugar otra vez</button><button class="btn wood" id="home">Inicio</button></div>
  </div>`;
  let msg=`¡Lo lograste, ${save.char.name}! Ganaste ${round.won} esmeraldas`;
  if(figOpen(2)&&!save.g2Seen){save.g2Seen=true;persist();msg+=". ¡Y abriste el nivel 2 de Figuras!";
    $(".reward .won").insertAdjacentHTML("afterend",`<p class="hello">¡Figuras nivel 2!</p>`)}
  for(const n of [2,3]){const k="l"+n+"Seen";if(lvlOpen(n)&&!save[k]){save[k]=true;persist();msg+=`. ¡Y abriste el nivel ${n} de Mina Rápida!`;
    $(".reward .won").insertAdjacentHTML("afterend",`<p class="hello">¡Nivel ${n} desbloqueado!</p>`)}}
  say(msg);
  const k=round.kind,o=round.opt;$("#replay").onclick=()=>startRound(k,o);$("#home").onclick=showHome;
}

// ---------- welcome (first run) ----------
function showWelcome(){
  screenEl.innerHTML=`<div class="home">
    <img class="logo" src="logo.png" alt="MineNumbers">
    <div class="menu" id="wMenu"><button class="btn" id="wNew">Jugador nuevo</button><button class="btn wood" id="wHave">Ya tengo un código</button></div>
    <div class="panel join" id="wForm" hidden>
      <label class="row-label" for="codeIn">Código familiar</label>
      <input class="name-in" id="codeIn" placeholder="MINA-AB12-CD34" autocomplete="off" autocapitalize="characters" maxlength="14">
      <p class="form-msg" id="codeMsg"></p>
      <button class="btn" id="codeGo">Entrar</button>
      <button class="btn stone" id="codeBack" style="min-height:52px;font-size:18px">Regresar</button>
    </div></div>`;
  $("#wNew").onclick=()=>{save.code=newCode();persist();showCreator()};
  $("#wHave").onclick=()=>{$("#wMenu").hidden=true;$("#wForm").hidden=false;$("#codeIn").focus()};
  $("#codeBack").onclick=showWelcome;
  $("#codeGo").onclick=async()=>{if(await joinCode($("#codeIn").value,$("#codeMsg")))save.char.name?showHome():showCreator()};
}

// ---------- aviso de descanso ----------
const REST_MS=10*60*1000,REST_KEY="minenumbers-tiempo";
let inGame=false,breakDue=false,playMs=0,lastTick=Date.now();
try{const t=JSON.parse(localStorage.getItem(REST_KEY)||"{}");if(t.at&&Date.now()-t.at<5*60*1000)playMs=t.ms||0}catch(e){}
setInterval(()=>{const now=Date.now(),d=now-lastTick;lastTick=now;
  if(sleeping||document.visibilityState!=="visible"||!settings.rest||!save.char.name)return;
  if(d>5*60*1000){playMs=0;return}
  playMs+=d;try{localStorage.setItem(REST_KEY,JSON.stringify({ms:playMs,at:now}))}catch(e){}
  if(playMs>=REST_MS)breakDue=true;
  if(breakDue&&!inGame&&!sleeping&&!document.getElementById("restOk"))showBreak();
},5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")lastTick=Date.now()});
function showBreak(){
  clearTimer();try{speechSynthesis.cancel()}catch(e){}
  screenEl.innerHTML=`<div class="reward rest">
    <h1>¡Estoy cansado!</h1>
    <div class="zzz" aria-hidden="true">Z<span>z</span><span>z</span></div>
    ${avatarHTML(save.char,avSize()+2,"tired")}
    <p class="hello">Es hora de un descanso</p>
    <p class="tip">Vamos a estirarnos, tomar agua y jugar después.</p>
    <div class="menu"><button class="btn" id="restOk">Está bien</button></div>
  </div>`;
  say(`${save.char.name}, ¡estoy cansado! Es hora de un descanso. Vamos a estirarnos y tomar agua.`);
  $("#restOk").onclick=()=>{playMs=0;breakDue=false;try{localStorage.setItem(SLEEP_KEY,String(Date.now()+SLEEP_MS))}catch(e){}try{localStorage.setItem(REST_KEY,JSON.stringify({ms:0,at:Date.now()}))}catch(e){}showSleep()};
}

let sleeping=false;
const SLEEP_KEY="minenumbers-descanso",SLEEP_MS=5*60*1000;
function sleepUntil(){try{return +localStorage.getItem(SLEEP_KEY)||0}catch(e){return 0}}
function showSleep(){
  sleeping=true;inGame=true;
  screenEl.innerHTML=`<div class="reward rest sleep">
    <div class="zzz" aria-hidden="true">Z<span>z</span><span>z</span></div>
    ${avatarHTML(save.char,avSize()+2,"tired")}
    <p class="hello">Tu minero está durmiendo</p>
    <p class="tip" id="sleepTip"></p>
  </div>`;
  const tick=()=>{const t=$("#sleepTip");if(!t)return;const left=sleepUntil()-Date.now();
    if(left>0){const m=Math.ceil(left/60000);t.textContent=`Vuelve a jugar en ${m} ${m===1?"minuto":"minutos"}.`;setTimeout(tick,5000)}
    else t.textContent="Ya descansó. Cierra la app y ábrela otra vez para jugar."};
  tick();say("Shhh. Buenas noches. A descansar.");
}

// ---------- install + offline ----------
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById("installBtn");if(b)b.hidden=false});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;const b=document.getElementById("installBtn");if(b)b.hidden=true});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

if(!save.code&&save.char.name){save.code=newCode();persist()}
if(!save.code)showWelcome();else if(save.char.name&&sleepUntil()>Date.now()){showSleep();pull()}else{save.char.name?showHome():showCreator();pull()}
})();
</script>
